<style>
html,body{margin:0;height:100%;background:#fff;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}
svg{width:min(86vmin,560px);height:auto;overflow:visible}
.ring{transform-origin:200px 200px;animation:spin 28s linear infinite}
.up{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite reverse}
.wob{transform-box:fill-box;transform-origin:center;transform:rotate(var(--t));animation:wob 3.2s ease-in-out infinite;transition:scale .25s cubic-bezier(.3,1.6,.5,1)}
.wob:hover{scale:1.25}
svg:hover .ring,svg:hover .up{transform-box:fill-box;transform-origin:center;animation-play-state:paused}
@keyframes spin{to{rotate:360deg}}
@keyframes wob{0%,100%{transform:rotate(var(--t)) translateY(0)}50%{transform:rotate(calc(var(--t) * -1)) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.ring,.up,.wob{transform-box:fill-box;transform-origin:center;animation:none}}
</style></head><body>
