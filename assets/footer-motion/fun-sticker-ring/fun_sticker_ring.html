<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fun Sticker Ring</title>
<style>
html,body{margin:0;height:100%;background:#fff;display:grid;place-items:center}
svg{width:min(86vmin,560px);height:auto;overflow:visible}
.ring{transform-origin:200px 200px;animation:spin 30s linear infinite}
.up{transform-box:fill-box;transform-origin:center;animation:spin 30s linear infinite reverse}
.wob{transform-box:fill-box;transform-origin:center;transform:rotate(var(--t));animation:wob 3.4s ease-in-out infinite;transition:scale .3s cubic-bezier(.3,1.7,.5,1);cursor:pointer}
.wob:hover{scale:1.3}
svg:hover .ring,svg:hover .up{animation-play-state:paused}
@keyframes spin{to{rotate:360deg}}
@keyframes wob{0%,100%{transform:rotate(var(--t)) translateY(0)}50%{transform:rotate(calc(var(--t) * -1)) translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.ring,.up,.wob{animation:none}}
</style></head><body>
